name: Bug Report
description: Report a bug with the AiMan code.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out all required sections below to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Explanation
      description: Describe what happened, what you expected to happen, and steps to reproduce.
      placeholder: Describe the bug in detail...
    validations:
      required: true

  - type: upload
    id: ama-file
    attributes:
      label: AMA File
      description: Drag and drop a `.zip` file containing your `.ama` file.
    validations:
      required: true

  - type: textarea
    id: aiman-command-output
    attributes:
      label: aiman -et Command Output
      description: Execute the exact same command you ran, but add `-et` directly after `aiman` (e.g., `aiman -et [your options]`). Paste the output below.
      placeholder: Paste the console output from `aiman -et ...` here...
      render: text
    validations:
      required: true

  - type: textarea
    id: json-file
    attributes:
      label: JSON File (Optional)
      description: If a JSON file was used during this run, drag and drop it here or paste its contents.
      placeholder: Attach or paste your .json file content here if applicable...
      render: json
    validations:
      required: false